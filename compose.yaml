services:
  database:
    container_name: database
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/posgresql
  
  migrator:
    container_name: migrator
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    environment:
      ConnectionStrings__BookingApp: "Host=database;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    depends_on:
      - database
  
  backend:
    container_name: backend
    image: backend
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__BookingApp: "Host=database;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Auth0__Domain: "https://${AUTH0_DOMAIN}/"
      Auth0__Audience: ${AUTH0_AUDIENCE}
    depends_on:
      migrator:
        condition: service_completed_successfully
        
  frontend:
    container_name: frontend
    image: frontend
    build:
      context: BookingApp.UI/
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_AUTH0_DOMAIN: ${AUTH0_DOMAIN}
        VITE_AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
        VITE_AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
    depends_on:
      - backend
    
  proxy:
    container_name: proxy
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

volumes:
  database: